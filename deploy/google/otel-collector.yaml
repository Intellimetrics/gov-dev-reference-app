# deploy/google/otel-collector.yaml: the collector for Cloud Run (lesson 36).
# The app is unchanged: it sends OTLP to localhost:4318. Traces go to Cloud Trace; check
# that Cloud Trace is in your Assured Workloads package first (it is not on the IL4 list).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  googlecloud:
    project: ${env:GOOGLE_CLOUD_PROJECT}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [googlecloud]
